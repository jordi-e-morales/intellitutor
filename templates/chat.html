{% extends "base.html" %}

{% block head %}
<!-- Marked.js for Markdown rendering -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<!-- Highlight.js for code syntax highlighting -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css">
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<!-- KaTeX for LaTeX rendering -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto py-6 px-4">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">{{ subject_name }}</h1>
            <p class="text-gray-600">Tutor Virtual</p>
        </div>
        <a href="{{ url_for('dashboard') }}" 
           class="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600 transition">
            <i class="fas fa-arrow-left mr-2"></i>Volver
        </a>
    </div>

    <!-- Chat container -->
    <div id="chat-container" class="bg-white rounded-xl shadow-lg flex flex-col h-[80vh]">
        <!-- Messages -->
        <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-3">
            <!-- Messages appended here -->
        </div>

        <!-- Input -->
        <div class="border-t p-3">
            <form id="chat-form" class="flex gap-2" autocomplete="off">
                <input type="hidden" id="subject_id" value="{{ subject_id }}" />
                <input id="message" type="text" class="flex-1 px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Escribe tu pregunta..." />
                <button type="submit" class="px-4 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const formEl = document.getElementById('chat-form');
const inputEl = document.getElementById('message');
const subjectId = document.getElementById('subject_id').value;

// Maintain a small chat history to send as context
const chatHistory = [];

// Enable streaming by default
const USE_STREAMING = true;

// Configure marked.js with highlight.js for code syntax highlighting
marked.setOptions({
  highlight: function(code, lang) {
    if (lang && hljs.getLanguage(lang)) {
      try {
        return hljs.highlight(code, { language: lang }).value;
      } catch (e) {}
    }
    return hljs.highlightAuto(code).value;
  },
  breaks: true,
  gfm: true
});

function renderMarkdown(text) {
  try {
    return marked.parse(text);
  } catch (e) {
    return escapeHtml(text);
  }
}

function renderLatex(element) {
  if (typeof renderMathInElement === 'function') {
    renderMathInElement(element, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '$', right: '$', display: false },
        { left: '\\[', right: '\\]', display: true },
        { left: '\\(', right: '\\)', display: false }
      ],
      throwOnError: false,
      errorColor: '#cc0000'
    });
  }
}

function appendMessage(role, text, isStreaming = false) {
  const wrapper = document.createElement('div');
  const base = 'max-w-[80%] px-4 py-3 rounded-lg shadow-sm';
  if (role === 'user') {
    wrapper.className = 'w-full flex justify-end';
    wrapper.innerHTML = `<div class="${base} bg-indigo-50 whitespace-pre-wrap">${escapeHtml(text)}</div>`;
  } else {
    wrapper.className = 'w-full flex justify-start';
    const streamClass = isStreaming ? 'streaming-message' : '';
    const content = text ? renderMarkdown(text) : '<span class="typing-indicator">...</span>';
    wrapper.innerHTML = `<div class="${base} bg-gray-100 ${streamClass} markdown-content">${content}</div>`;
    // Render LaTeX in tutor messages
    if (text && !isStreaming) {
      renderLatex(wrapper);
    }
  }
  messagesEl.appendChild(wrapper);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return wrapper;
}

function updateStreamingMessage(wrapper, text, isComplete = false) {
  const msgDiv = wrapper.querySelector('div');
  if (msgDiv) {
    msgDiv.innerHTML = renderMarkdown(text);
    // Render LaTeX only when streaming is complete (performance optimization)
    if (isComplete) {
      renderLatex(wrapper);
    }
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
}

function escapeHtml(str) {
  const p = document.createElement('p');
  p.innerText = str;
  return p.innerHTML;
}

// Streaming chat using fetch + ReadableStream
async function sendMessageStreaming(msg, historyToSend) {
  // Create placeholder message
  const wrapper = appendMessage('tutor', '', true);
  let fullResponse = '';

  try {
    const res = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: msg,
        subject_id: Number(subjectId),
        chat_history: historyToSend
      })
    });

    if (!res.ok) {
      const errData = await res.json();
      updateStreamingMessage(wrapper, errData.error || 'Error del servidor');
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      const chunk = decoder.decode(value, { stream: true });
      // Parse SSE events
      const lines = chunk.split('\n');
      for (const line of lines) {
        if (line.startsWith('data: ')) {
          try {
            const data = JSON.parse(line.slice(6));
            if (data.chunk) {
              fullResponse += data.chunk;
              updateStreamingMessage(wrapper, fullResponse);
            }
            if (data.error) {
              fullResponse += `\n[Error: ${data.error}]`;
              updateStreamingMessage(wrapper, fullResponse);
            }
            if (data.done) {
              // Streaming complete - render LaTeX now
              updateStreamingMessage(wrapper, fullResponse, true);
            }
          } catch (e) {
            // Ignore parse errors for incomplete chunks
          }
        }
      }
    }

    // Save to history
    if (fullResponse) {
      chatHistory.push({ user: msg, tutor: fullResponse });
    }
  } catch (err) {
    updateStreamingMessage(wrapper, 'No se pudo contactar al servidor.');
  }
}

// Non-streaming fallback
async function sendMessageNonStreaming(msg, historyToSend) {
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: msg,
        subject_id: Number(subjectId),
        chat_history: historyToSend
      })
    });
    const data = await res.json();
    if (!res.ok) {
      appendMessage('tutor', data.error || 'Error del servidor');
      return;
    }
    const reply = data.reply || '';
    appendMessage('tutor', reply);
    chatHistory.push({ user: msg, tutor: reply });
  } catch (err) {
    appendMessage('tutor', 'No se pudo contactar al servidor.');
  }
}

formEl.addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = (inputEl.value || '').trim();
  if (!msg) return;

  // UI: show user message
  appendMessage('user', msg);
  inputEl.value = '';
  inputEl.disabled = true;

  // Build minimal history (last 5)
  const historyToSend = chatHistory.slice(-5);

  // Send to backend (streaming or non-streaming)
  if (USE_STREAMING) {
    await sendMessageStreaming(msg, historyToSend);
  } else {
    await sendMessageNonStreaming(msg, historyToSend);
  }

  inputEl.disabled = false;
  inputEl.focus();
});
</script>

<style>
.typing-indicator {
  animation: blink 1s infinite;
}
@keyframes blink {
  0%, 50% { opacity: 1; }
  51%, 100% { opacity: 0.3; }
}
.streaming-message {
  border-left: 3px solid #6366f1;
}

/* Markdown content styling */
.markdown-content {
  line-height: 1.6;
}
.markdown-content p {
  margin-bottom: 0.75rem;
}
.markdown-content p:last-child {
  margin-bottom: 0;
}
.markdown-content h1, .markdown-content h2, .markdown-content h3,
.markdown-content h4, .markdown-content h5, .markdown-content h6 {
  font-weight: 600;
  margin-top: 1rem;
  margin-bottom: 0.5rem;
}
.markdown-content h1 { font-size: 1.5rem; }
.markdown-content h2 { font-size: 1.25rem; }
.markdown-content h3 { font-size: 1.125rem; }
.markdown-content ul, .markdown-content ol {
  margin-left: 1.5rem;
  margin-bottom: 0.75rem;
}
.markdown-content ul { list-style-type: disc; }
.markdown-content ol { list-style-type: decimal; }
.markdown-content li {
  margin-bottom: 0.25rem;
}
.markdown-content code {
  background-color: rgba(0, 0, 0, 0.08);
  padding: 0.125rem 0.375rem;
  border-radius: 0.25rem;
  font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
  font-size: 0.875em;
}
.markdown-content pre {
  background-color: #1f2937;
  color: #e5e7eb;
  padding: 1rem;
  border-radius: 0.5rem;
  overflow-x: auto;
  margin-bottom: 0.75rem;
}
.markdown-content pre code {
  background-color: transparent;
  padding: 0;
  color: inherit;
}
.markdown-content blockquote {
  border-left: 4px solid #6366f1;
  padding-left: 1rem;
  margin-left: 0;
  margin-bottom: 0.75rem;
  color: #4b5563;
  font-style: italic;
}
.markdown-content a {
  color: #4f46e5;
  text-decoration: underline;
}
.markdown-content a:hover {
  color: #4338ca;
}
.markdown-content table {
  border-collapse: collapse;
  width: 100%;
  margin-bottom: 0.75rem;
}
.markdown-content th, .markdown-content td {
  border: 1px solid #d1d5db;
  padding: 0.5rem;
  text-align: left;
}
.markdown-content th {
  background-color: #f3f4f6;
  font-weight: 600;
}
.markdown-content hr {
  border: none;
  border-top: 1px solid #d1d5db;
  margin: 1rem 0;
}
.markdown-content strong {
  font-weight: 600;
}
.markdown-content em {
  font-style: italic;
}
</style>
{% endblock %}
