{% extends "base.html" %}

{% block head %}
<!-- Marked.js for Markdown rendering -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<!-- Highlight.js for code syntax highlighting -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css">
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<!-- KaTeX for LaTeX rendering -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<!-- Mermaid.js for diagrams -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto py-6 px-4">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">{{ subject_name }}</h1>
            <p class="text-gray-600">Tutor Virtual</p>
        </div>
        <a href="{{ url_for('dashboard') }}" 
           class="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600 transition">
            <i class="fas fa-arrow-left mr-2"></i>Volver
        </a>
    </div>

    <!-- Chat container -->
    <div id="chat-container" class="bg-white rounded-xl shadow-lg flex flex-col h-[80vh]">
        <!-- Messages -->
        <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-3">
            <!-- Messages appended here -->
        </div>

        <!-- Input -->
        <div class="border-t p-3">
            <form id="chat-form" class="flex gap-2" autocomplete="off">
                <input type="hidden" id="subject_id" value="{{ subject_id }}" />
                <input id="message" type="text" class="flex-1 px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Escribe tu pregunta..." />
                <button type="submit" class="px-4 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const formEl = document.getElementById('chat-form');
const inputEl = document.getElementById('message');
const subjectId = document.getElementById('subject_id').value;

// Maintain a small chat history to send as context
const chatHistory = [];

// Enable streaming by default
const USE_STREAMING = true;

// Track last user message and tutor response for editing
let lastUserMessageWrapper = null;
let lastTutorResponseWrapper = null;
let isEditing = false;

// Initialize Mermaid
mermaid.initialize({
  startOnLoad: false,
  theme: 'default',
  securityLevel: 'loose',
  fontFamily: 'inherit'
});

// Counter for unique mermaid diagram IDs
let mermaidCounter = 0;

// Custom renderer for marked.js to handle mermaid code blocks
const renderer = new marked.Renderer();
const originalCodeRenderer = renderer.code.bind(renderer);

renderer.code = function(code, language, isEscaped) {
  if (language === 'mermaid') {
    const id = `mermaid-${mermaidCounter++}`;
    return `<div class="mermaid-container"><pre class="mermaid" id="${id}">${code}</pre></div>`;
  }
  // For other languages, use highlight.js
  if (language && hljs.getLanguage(language)) {
    try {
      const highlighted = hljs.highlight(code, { language: language }).value;
      return `<pre><code class="hljs language-${language}">${highlighted}</code></pre>`;
    } catch (e) {}
  }
  const highlighted = hljs.highlightAuto(code).value;
  return `<pre><code class="hljs">${highlighted}</code></pre>`;
};

// Configure marked.js
marked.setOptions({
  renderer: renderer,
  breaks: true,
  gfm: true
});

function renderMarkdown(text) {
  try {
    return marked.parse(text);
  } catch (e) {
    return escapeHtml(text);
  }
}

function renderLatex(element) {
  if (typeof renderMathInElement === 'function') {
    renderMathInElement(element, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '$', right: '$', display: false },
        { left: '\\[', right: '\\]', display: true },
        { left: '\\(', right: '\\)', display: false }
      ],
      throwOnError: false,
      errorColor: '#cc0000'
    });
  }
}

async function renderMermaidDiagrams(element) {
  const mermaidElements = element.querySelectorAll('.mermaid:not([data-processed])');
  for (const el of mermaidElements) {
    try {
      const id = el.id || `mermaid-${mermaidCounter++}`;
      const graphDefinition = el.textContent;
      const { svg } = await mermaid.render(id + '-svg', graphDefinition);
      el.innerHTML = svg;
      el.setAttribute('data-processed', 'true');
    } catch (e) {
      console.error('Mermaid rendering error:', e);
      el.innerHTML = `<span class="text-red-500">Error rendering diagram: ${e.message}</span>`;
    }
  }
}

function appendMessage(role, text, isStreaming = false) {
  // Remove edit button from previous user message if exists
  if (role === 'user' && lastUserMessageWrapper) {
    const prevEditBtn = lastUserMessageWrapper.querySelector('.edit-btn');
    if (prevEditBtn) prevEditBtn.remove();
  }

  const wrapper = document.createElement('div');
  const base = 'max-w-[80%] px-4 py-3 rounded-lg shadow-sm';
  if (role === 'user') {
    wrapper.className = 'w-full flex justify-end items-end gap-2';
    wrapper.innerHTML = `
      <button class="edit-btn text-gray-400 hover:text-indigo-600 transition p-1" title="Editar mensaje">
        <i class="fas fa-pencil-alt text-sm"></i>
      </button>
      <div class="${base} bg-indigo-50 whitespace-pre-wrap user-message-content" data-original-text="${escapeHtml(text)}">${escapeHtml(text)}</div>
    `;
    // Add edit button click handler
    const editBtn = wrapper.querySelector('.edit-btn');
    editBtn.addEventListener('click', () => startEditingMessage(wrapper, text));
    // Track this as the last user message
    lastUserMessageWrapper = wrapper;
  } else {
    wrapper.className = 'w-full flex justify-start';
    const streamClass = isStreaming ? 'streaming-message' : '';
    const content = text ? renderMarkdown(text) : '<span class="typing-indicator">...</span>';
    wrapper.innerHTML = `<div class="${base} bg-gray-100 ${streamClass} markdown-content">${content}</div>`;
    // Render LaTeX and Mermaid in tutor messages (only when not streaming)
    if (text && !isStreaming) {
      renderLatex(wrapper);
      renderMermaidDiagrams(wrapper);
    }
    // Track this as the last tutor response
    lastTutorResponseWrapper = wrapper;
  }
  messagesEl.appendChild(wrapper);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return wrapper;
}

function updateStreamingMessage(wrapper, text, isComplete = false) {
  const msgDiv = wrapper.querySelector('div');
  if (msgDiv) {
    msgDiv.innerHTML = renderMarkdown(text);
    // Render LaTeX and Mermaid only when streaming is complete (performance optimization)
    if (isComplete) {
      renderLatex(wrapper);
      renderMermaidDiagrams(wrapper);
    }
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
}

function escapeHtml(str) {
  const p = document.createElement('p');
  p.innerText = str;
  return p.innerHTML;
}

function startEditingMessage(wrapper, originalText) {
  if (isEditing) return;
  isEditing = true;

  const msgDiv = wrapper.querySelector('.user-message-content');
  const editBtn = wrapper.querySelector('.edit-btn');
  if (editBtn) editBtn.style.display = 'none';

  // Create edit input
  const editContainer = document.createElement('div');
  editContainer.className = 'flex-1 flex gap-2 edit-container';
  editContainer.innerHTML = `
    <input type="text" class="edit-input flex-1 px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" value="${escapeHtml(originalText)}" />
    <button class="save-edit-btn px-3 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700" title="Guardar">
      <i class="fas fa-check"></i>
    </button>
    <button class="cancel-edit-btn px-3 py-2 bg-gray-400 text-white rounded-lg hover:bg-gray-500" title="Cancelar">
      <i class="fas fa-times"></i>
    </button>
  `;

  // Hide original message
  msgDiv.style.display = 'none';
  wrapper.insertBefore(editContainer, msgDiv);

  const editInput = editContainer.querySelector('.edit-input');
  const saveBtn = editContainer.querySelector('.save-edit-btn');
  const cancelBtn = editContainer.querySelector('.cancel-edit-btn');

  editInput.focus();
  editInput.select();

  // Cancel editing
  const cancelEdit = () => {
    editContainer.remove();
    msgDiv.style.display = '';
    if (editBtn) editBtn.style.display = '';
    isEditing = false;
  };

  // Save edit and regenerate response
  const saveEdit = async () => {
    const newText = editInput.value.trim();
    if (!newText) {
      cancelEdit();
      return;
    }

    // Update the message display
    msgDiv.textContent = newText;
    msgDiv.setAttribute('data-original-text', escapeHtml(newText));
    editContainer.remove();
    msgDiv.style.display = '';
    if (editBtn) editBtn.style.display = '';
    isEditing = false;

    // Update the last entry in chat history
    if (chatHistory.length > 0) {
      chatHistory.pop();
    }

    // Disable main input while regenerating
    inputEl.disabled = true;

    // Clear and regenerate tutor response
    if (lastTutorResponseWrapper) {
      const base = 'max-w-[80%] px-4 py-3 rounded-lg shadow-sm';
      lastTutorResponseWrapper.innerHTML = `<div class="${base} bg-gray-100 streaming-message markdown-content"><span class="typing-indicator">...</span></div>`;
    }

    // Build history (excluding the message we're editing)
    const historyToSend = chatHistory.slice(-5);

    // Regenerate response
    if (USE_STREAMING) {
      await regenerateResponseStreaming(newText, historyToSend, lastTutorResponseWrapper);
    } else {
      await regenerateResponseNonStreaming(newText, historyToSend, lastTutorResponseWrapper);
    }

    inputEl.disabled = false;
    inputEl.focus();
  };

  saveBtn.addEventListener('click', saveEdit);
  cancelBtn.addEventListener('click', cancelEdit);
  editInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      saveEdit();
    } else if (e.key === 'Escape') {
      cancelEdit();
    }
  });
}

// Regenerate response for edited message (streaming)
async function regenerateResponseStreaming(msg, historyToSend, wrapper) {
  let fullResponse = '';

  try {
    const res = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: msg,
        subject_id: Number(subjectId),
        chat_history: historyToSend
      })
    });

    if (!res.ok) {
      const errData = await res.json();
      updateStreamingMessage(wrapper, errData.error || 'Error del servidor');
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      const chunk = decoder.decode(value, { stream: true });
      const lines = chunk.split('\n');
      for (const line of lines) {
        if (line.startsWith('data: ')) {
          try {
            const data = JSON.parse(line.slice(6));
            if (data.chunk) {
              fullResponse += data.chunk;
              updateStreamingMessage(wrapper, fullResponse);
            }
            if (data.error) {
              fullResponse += `\n[Error: ${data.error}]`;
              updateStreamingMessage(wrapper, fullResponse);
            }
            if (data.done) {
              updateStreamingMessage(wrapper, fullResponse, true);
            }
          } catch (e) {}
        }
      }
    }

    if (fullResponse) {
      chatHistory.push({ user: msg, tutor: fullResponse });
    }
  } catch (err) {
    updateStreamingMessage(wrapper, 'No se pudo contactar al servidor.');
  }
}

// Regenerate response for edited message (non-streaming)
async function regenerateResponseNonStreaming(msg, historyToSend, wrapper) {
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: msg,
        subject_id: Number(subjectId),
        chat_history: historyToSend
      })
    });
    const data = await res.json();
    if (!res.ok) {
      updateStreamingMessage(wrapper, data.error || 'Error del servidor', true);
      return;
    }
    const reply = data.reply || '';
    updateStreamingMessage(wrapper, reply, true);
    chatHistory.push({ user: msg, tutor: reply });
  } catch (err) {
    updateStreamingMessage(wrapper, 'No se pudo contactar al servidor.', true);
  }
}

// Streaming chat using fetch + ReadableStream
async function sendMessageStreaming(msg, historyToSend) {
  // Create placeholder message
  const wrapper = appendMessage('tutor', '', true);
  let fullResponse = '';

  try {
    const res = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: msg,
        subject_id: Number(subjectId),
        chat_history: historyToSend
      })
    });

    if (!res.ok) {
      const errData = await res.json();
      updateStreamingMessage(wrapper, errData.error || 'Error del servidor');
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      const chunk = decoder.decode(value, { stream: true });
      // Parse SSE events
      const lines = chunk.split('\n');
      for (const line of lines) {
        if (line.startsWith('data: ')) {
          try {
            const data = JSON.parse(line.slice(6));
            if (data.chunk) {
              fullResponse += data.chunk;
              updateStreamingMessage(wrapper, fullResponse);
            }
            if (data.error) {
              fullResponse += `\n[Error: ${data.error}]`;
              updateStreamingMessage(wrapper, fullResponse);
            }
            if (data.done) {
              // Streaming complete - render LaTeX now
              updateStreamingMessage(wrapper, fullResponse, true);
            }
          } catch (e) {
            // Ignore parse errors for incomplete chunks
          }
        }
      }
    }

    // Save to history
    if (fullResponse) {
      chatHistory.push({ user: msg, tutor: fullResponse });
    }
  } catch (err) {
    updateStreamingMessage(wrapper, 'No se pudo contactar al servidor.');
  }
}

// Non-streaming fallback
async function sendMessageNonStreaming(msg, historyToSend) {
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: msg,
        subject_id: Number(subjectId),
        chat_history: historyToSend
      })
    });
    const data = await res.json();
    if (!res.ok) {
      appendMessage('tutor', data.error || 'Error del servidor');
      return;
    }
    const reply = data.reply || '';
    appendMessage('tutor', reply);
    chatHistory.push({ user: msg, tutor: reply });
  } catch (err) {
    appendMessage('tutor', 'No se pudo contactar al servidor.');
  }
}

formEl.addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = (inputEl.value || '').trim();
  if (!msg) return;

  // UI: show user message
  appendMessage('user', msg);
  inputEl.value = '';
  inputEl.disabled = true;

  // Build minimal history (last 5)
  const historyToSend = chatHistory.slice(-5);

  // Send to backend (streaming or non-streaming)
  if (USE_STREAMING) {
    await sendMessageStreaming(msg, historyToSend);
  } else {
    await sendMessageNonStreaming(msg, historyToSend);
  }

  inputEl.disabled = false;
  inputEl.focus();
});
</script>

}
